services:
  app:
    build: .
    image: projeclyze.dev
    ports:
      - '${PORT}:${PORT}'
    environment:
      - ENV=${ENV}
      - PORT=${PORT}
      - DB_URL=${DB_URL}

  database:
    image: postgres:17.1-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    ports:
      - '${DATABASE_PORT}:${DATABASE_PORT}'
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
